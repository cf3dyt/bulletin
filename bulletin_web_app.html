<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulletin - Modern Cork-Board Collaboration</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cork: {
                            light: '#f5efe6',
                            DEFAULT: '#e3d5ca',
                            dark: '#d5bdaf',
                            deep: '#8d6e63',
                        },
                        amber: {
                            50: '#fdf8f6',
                            100: '#fbeee6',
                            250: '#f2d6c9',
                            500: '#c57b57',
                            650: '#a35c3a',
                            800: '#6b381d',
                            900: '#4a2410',
                        },
                        cream: '#faf7f2',
                        paper: '#fffdf9'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Inter Font & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom Cork-board Background Texture */
        .cork-texture {
            background-color: #e3d5ca;
            background-image: radial-gradient(#d5bdaf 15%, transparent 16%), radial-gradient(#c57b57 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f5efe6; }
        ::-webkit-scrollbar-thumb { background: #c57b57; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #a35c3a; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-full bg-cream text-amber-900 selection:bg-amber-250 selection:text-amber-900 overflow-x-hidden">

    <!-- App Root Container -->
    <div id="app" class="min-h-full flex flex-col">
        <!-- Dynamic views will be rendered here by JavaScript -->
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Application JavaScript Code -->
    <script>
        // --- State Management ---
        const State = {
            currentUser: null, // { id, name, email, phone, avatar }
            currentView: 'auth', // 'auth', 'tutorial', 'dashboard', 'bulletin_detail'
            activeBulletinId: null,
            activeTab: 'stream', // 'stream', 'weekly', 'polls', 'events', 'ai', 'contacts', 'settings'
            isActionMenuOpen: false,
            
            // Mock Data Store
            users: [
                { id: 'u1', name: 'Sally Chen', email: 'sally@friends.com', phone: '555-0192', avatar: 'https://placehold.co/150/c57b57/fffdf9?text=SC' },
                { id: 'u2', name: 'Alex Rivera', email: 'alex@rivera.com', phone: '555-8832', avatar: 'https://placehold.co/150/8d6e63/fffdf9?text=AR' }
            ],
            contacts: [
                { id: 'c1', name: 'Sally Chen', email: 'sally@friends.com', phone: '555-0192' },
                { id: 'c2', name: 'Alex Rivera', email: 'alex@rivera.com', phone: '555-8832' },
                { id: 'c3', name: 'Jordan Lee', email: 'jordan@lee.com', phone: '555-4321' }
            ],
            bulletins: [
                {
                    id: 'b1',
                    name: 'Sally and friends',
                    description: 'Our cozy hangout spot for weekend trips, coffee chats, and memories! ☕',
                    code: 'SALLY2026',
                    ownerId: 'u1',
                    members: ['u1', 'u2'],
                    settings: { joinMode: 'code', calendarSync: true }
                }
            ],
            posts: [
                {
                    id: 'p1',
                    bulletinId: 'b1',
                    authorId: 'u1',
                    authorName: 'Sally Chen',
                    title: 'Weekend Brunch at Café Central 🥐',
                    text: 'Hey everyone! Let us meet up this Sunday at 10 AM at Café Central downtown. They have amazing pastries and matcha lattes!',
                    image: 'https://placehold.co/600x400/e3d5ca/6b381d?text=Brunch+Meetup',
                    link: 'https://maps.google.com',
                    recipients: 'all',
                    timestamp: '2 hours ago',
                    likes: 4,
                    comments: [
                        { author: 'Alex Rivera', text: 'Count me in! craving a matcha latte.' }
                    ]
                }
            ],
            events: [
                {
                    id: 'e1',
                    bulletinId: 'b1',
                    authorName: 'Sally Chen',
                    title: 'Potluck Dinner & Board Games',
                    date: '2026-05-15',
                    time: '18:30',
                    location: 'Sally’s Apartment (Apt 4B)',
                    link: 'https://zoom.us',
                    info: 'Bring your favorite board game or homemade snack! Drinks will be provided.',
                    attendees: ['u1', 'u2']
                }
            ],
            polls: [
                {
                    id: 'po1',
                    bulletinId: 'b1',
                    authorName: 'Sally Chen',
                    question: 'Where should we go for our next weekend camping trip?',
                    options: [
                        { text: 'Pinecrest Mountain', votes: 3 },
                        { text: 'Whispering Pines Lake', votes: 5 },
                        { text: 'Canyon State Park', votes: 1 }
                    ],
                    voters: {}
                }
            ],
            settings: {
                calendarSync: true,
                notifications: true,
                privacy: 'friends',
                theme: 'cork'
            }
        };

        // --- Utility Functions ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-3 pointer-events-auto fade-in ${
                type === 'success' ? 'bg-amber-900 text-cream' : 'bg-red-800 text-cream'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-amber-250' : 'fa-circle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- Navigation / Render Router ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (State.currentView === 'auth') {
                app.innerHTML = renderAuthView();
                attachAuthListeners();
            } else if (State.currentView === 'tutorial') {
                app.innerHTML = renderTutorialView();
                attachTutorialListeners();
            } else if (State.currentView === 'dashboard') {
                app.innerHTML = renderDashboardView();
                attachDashboardListeners();
            } else if (State.currentView === 'bulletin_detail') {
                app.innerHTML = renderBulletinDetailView();
                attachBulletinDetailListeners();
            }
        }

        // --- 1. Authentication View ---
        function renderAuthView() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 cork-texture">
                    <div class="max-w-md w-full bg-paper rounded-3xl shadow-2xl p-8 border border-amber-250 fade-in">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-amber-500 text-cream shadow-lg mb-4">
                                <i class="fa-solid fa-note-sticky text-3xl"></i>
                            </div>
                            <h1 class="text-3xl font-bold text-amber-900 tracking-tight">Bulletin</h1>
                            <p class="text-amber-800/80 text-sm mt-1">Minimalist cork-board collaboration & community</p>
                        </div>

                        <div id="auth-tabs" class="flex rounded-xl bg-amber-50 p-1 mb-6 border border-amber-250">
                            <button id="tab-login" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-cream shadow-sm transition-all" onclick="switchAuthTab('login')">Sign In</button>
                            <button id="tab-register" class="flex-1 py-2 text-sm font-semibold rounded-lg text-amber-800 hover:text-amber-900 transition-all" onclick="switchAuthTab('register')">Create Account</button>
                        </div>

                        <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                            <div id="name-field-container" class="hidden">
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Full Name</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-amber-800/50"><i class="fa-regular fa-user"></i></span>
                                    <input type="text" id="auth-name" placeholder="Alex Johnson" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Email Address or Phone</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-amber-800/50"><i class="fa-regular fa-envelope"></i></span>
                                    <input type="text" id="auth-email" required placeholder="alex@example.com or phone" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-amber-800/50"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                                </div>
                            </div>

                            <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-amber-500 hover:bg-amber-650 text-cream font-semibold rounded-xl shadow-md transition-all flex items-center justify-center gap-2 mt-2">
                                <span id="auth-btn-text">Sign In</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        let isRegisterMode = false;
        function switchAuthTab(mode) {
            isRegisterMode = (mode === 'register');
            const nameField = document.getElementById('name-field-container');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const submitText = document.getElementById('auth-btn-text');

            if (isRegisterMode) {
                nameField.classList.remove('hidden');
                tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-cream shadow-sm transition-all";
                tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-amber-800 hover:text-amber-900 transition-all";
                submitText.textContent = "Create Account & Start";
            } else {
                nameField.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-cream shadow-sm transition-all";
                tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-amber-800 hover:text-amber-900 transition-all";
                submitText.textContent = "Sign In";
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const nameInput = document.getElementById('auth-name');
            
            if (isRegisterMode) {
                const name = nameInput.value || 'New User';
                State.currentUser = { id: 'u_' + Date.now(), name, email, avatar: `https://placehold.co/150/c57b57/fffdf9?text=${name.substring(0,2).toUpperCase()}` };
                State.currentView = 'tutorial'; // First login gets interactive tutorial with Sally!
                showToast('Account created successfully! Welcome to Bulletin.');
            } else {
                State.currentUser = { id: 'u_demo', name: 'Alex Rivera', email, avatar: 'https://placehold.co/150/8d6e63/fffdf9?text=AR' };
                State.currentView = 'dashboard';
                showToast('Welcome back, ' + State.currentUser.name + '!');
            }
            render();
        }

        function attachAuthListeners() {}

        // --- 2. Interactive Tutorial View (Sally and Friends) ---
        function renderTutorialView() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 cork-texture">
                    <div class="max-w-lg w-full bg-paper rounded-3xl shadow-2xl p-8 border border-amber-250 fade-in">
                        <div class="flex items-center gap-4 mb-6">
                            <img src="https://placehold.co/150/c57b57/fffdf9?text=SC" class="w-14 h-14 rounded-full border-2 border-amber-500 shadow-md">
                            <div>
                                <span class="bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">Tutorial Tour</span>
                                <h2 class="text-2xl font-bold text-amber-900 mt-1">Meet Sally & Friends</h2>
                            </div>
                        </div>

                        <div class="bg-amber-50 rounded-2xl p-5 border border-amber-250 mb-6 text-amber-900/90 text-sm leading-relaxed">
                            <p class="mb-3">👋 Hi <strong>${State.currentUser.name}</strong>! Welcome to Bulletin. To help you get started, we've automatically set up a sample bulletin called <strong>"Sally and friends"</strong>.</p>
                            <p>Here you can share posts like Instagram, organize upcoming events, vote in group polls, and consult your AI Bulletin Assistant!</p>
                        </div>

                        <div class="space-y-3">
                            <button onclick="completeTutorial()" class="w-full py-3.5 bg-amber-500 hover:bg-amber-650 text-cream font-semibold rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-compass"></i>
                                <span>Explore "Sally and Friends" Bulletin</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        function attachTutorialListeners() {}
        function completeTutorial() {
            State.currentView = 'dashboard';
            render();
        }

        // --- 3. Dashboard / Home Page (Bulletins Grid) ---
        function renderDashboardView() {
            return `
                <div class="min-h-screen flex flex-col cork-texture">
                    <!-- Top Navigation Header -->
                    <header class="bg-paper/90 backdrop-blur border-b border-amber-250 sticky top-0 z-30 px-6 py-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-amber-500 text-cream flex items-center justify-center shadow-md">
                                <i class="fa-solid fa-note-sticky text-xl"></i>
                            </div>
                            <span class="text-xl font-bold text-amber-900 tracking-tight">Bulletin</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <button onclick="switchTabInDashboard('contacts')" class="text-amber-800 hover:text-amber-900 text-sm font-medium flex items-center gap-2 bg-amber-50 px-3 py-2 rounded-xl border border-amber-250">
                                <i class="fa-solid fa-address-book"></i> Contacts
                            </button>
                            <button onclick="switchTabInDashboard('settings')" class="text-amber-800 hover:text-amber-900 text-sm font-medium flex items-center gap-2 bg-amber-50 px-3 py-2 rounded-xl border border-amber-250">
                                <i class="fa-solid fa-gear"></i> Settings
                            </button>
                            <div class="flex items-center gap-2 pl-2 border-l border-amber-250">
                                <img src="${State.currentUser.avatar}" class="w-9 h-9 rounded-full border border-amber-500">
                                <span class="text-sm font-semibold text-amber-900 hidden sm:inline">${State.currentUser.name}</span>
                            </div>
                        </div>
                    </header>

                    <!-- Main Content Area -->
                    <main class="flex-1 max-w-6xl w-full mx-auto p-6 md:p-8">
                        <div class="flex items-center justify-between mb-8">
                            <div>
                                <h1 class="text-3xl font-bold text-amber-900">Your Bulletins</h1>
                                <p class="text-amber-800/80 text-sm mt-1">Select a cork-board group or create a new one.</p>
                            </div>
                        </div>

                        <!-- Bulletin Cards Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${State.bulletins.map(b => `
                                <div onclick="openBulletin('${b.id}')" class="bg-paper rounded-2xl p-6 shadow-xl border border-amber-250 hover:shadow-2xl transition-all cursor-pointer group flex flex-col justify-between">
                                    <div>
                                        <div class="flex items-center justify-between mb-4">
                                            <span class="bg-amber-100 text-amber-800 text-xs font-semibold px-3 py-1 rounded-full"><i class="fa-solid fa-thumbtack mr-1"></i> Bulletin Board</span>
                                            <span class="text-xs text-amber-800/60 font-mono">Code: ${b.code}</span>
                                        </div>
                                        <h3 class="text-xl font-bold text-amber-900 group-hover:text-amber-650 transition-colors mb-2">${b.name}</h3>
                                        <p class="text-amber-800/80 text-sm line-clamp-2">${b.description}</p>
                                    </div>
                                    <div class="mt-6 pt-4 border-t border-amber-100 flex items-center justify-between text-xs text-amber-800">
                                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-users"></i> ${b.members.length} Members</span>
                                        <span class="font-semibold group-hover:translate-x-1 transition-transform text-amber-500 flex items-center gap-1">Open Board <i class="fa-solid fa-arrow-right"></i></span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </main>

                    <!-- Floating Plus Action Button with Smooth Animation -->
                    <div class="fixed bottom-8 right-8 z-40 flex flex-col items-end">
                        <div id="action-menu" class="flex flex-col gap-3 mb-4 transition-all duration-300 transform scale-0 opacity-0 origin-bottom-right pointer-events-none">
                            <button onclick="openCreateBulletinModal()" class="flex items-center gap-3 bg-paper text-amber-900 px-5 py-3 rounded-2xl shadow-xl border border-amber-250 font-semibold hover:bg-amber-50 transition-all">
                                <span class="bg-amber-500 text-cream w-8 h-8 rounded-xl flex items-center justify-center"><i class="fa-solid fa-plus"></i></span>
                                Create Bulletin
                            </button>
                            <button onclick="openJoinBulletinModal()" class="flex items-center gap-3 bg-paper text-amber-900 px-5 py-3 rounded-2xl shadow-xl border border-amber-250 font-semibold hover:bg-amber-50 transition-all">
                                <span class="bg-amber-800 text-cream w-8 h-8 rounded-xl flex items-center justify-center"><i class="fa-solid fa-right-to-bracket"></i></span>
                                Join Bulletin
                            </button>
                        </div>
                        <button onclick="toggleActionMenu()" id="fab-main-btn" class="w-16 h-16 rounded-full bg-amber-500 hover:bg-amber-650 text-cream shadow-2xl flex items-center justify-center text-2xl transition-transform duration-300 hover:rotate-45">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>

                    <!-- Modal Container -->
                    <div id="modal-container"></div>
                </div>
            `;
        }

        function toggleActionMenu() {
            State.isActionMenuOpen = !State.isActionMenuOpen;
            const menu = document.getElementById('action-menu');
            const btn = document.getElementById('fab-main-btn');
            if (State.isActionMenuOpen) {
                menu.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                menu.classList.add('scale-100', 'opacity-100');
                btn.style.transform = 'rotate(45deg)';
            } else {
                menu.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
                menu.classList.remove('scale-100', 'opacity-100');
                btn.style.transform = 'rotate(0deg)';
            }
        }

        function attachDashboardListeners() {
            // Close menu if clicked outside
            document.addEventListener('click', (e) => {
                if (State.isActionMenuOpen && !e.target.closest('#action-menu') && !e.target.closest('#fab-main-btn')) {
                    toggleActionMenu();
                }
            }, { once: true });
        }

        function switchTabInDashboard(tab) {
            // Quick navigation to contacts or settings from dashboard header
            State.activeBulletinId = State.bulletins[0].id;
            State.activeTab = tab;
            State.currentView = 'bulletin_detail';
            render();
        }

        // --- Create & Join Bulletin Modals ---
        function openCreateBulletinModal() {
            toggleActionMenu();
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-amber-950/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
                    <div class="bg-paper max-w-md w-full rounded-3xl p-6 shadow-2xl border border-amber-250">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xl font-bold text-amber-900">Create New Bulletin</h3>
                            <button onclick="closeModal()" class="text-amber-800 hover:text-amber-900"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onsubmit="handleCreateBulletin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Bulletin Name</label>
                                <input type="text" id="new-b-name" required placeholder="e.g. Weekend Hikers" class="w-full px-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Description</label>
                                <textarea id="new-b-desc" rows="3" placeholder="What is this bulletin about?" class="w-full px-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Join Setting</label>
                                <select id="new-b-mode" class="w-full px-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    <option value="code">Code or Link required</option>
                                    <option value="open">Open to anyone with link</option>
                                    <option value="approval">Owner approval required</option>
                                </select>
                            </div>
                            <div class="flex justify-end gap-3 pt-2">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-amber-250 text-amber-800 text-sm font-semibold hover:bg-amber-50">Cancel</button>
                                <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-650 text-cream rounded-xl text-sm font-semibold shadow-md">Create</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleCreateBulletin(e) {
            e.preventDefault();
            const name = document.getElementById('new-b-name').value;
            const description = document.getElementById('new-b-desc').value;
            const joinMode = document.getElementById('new-b-mode').value;
            const code = 'BUL' + Math.floor(1000 + Math.random() * 9000);

            const newB = {
                id: 'b_' + Date.now(),
                name,
                description,
                code,
                ownerId: State.currentUser.id,
                members: [State.currentUser.id],
                settings: { joinMode, calendarSync: true }
            };

            State.bulletins.push(newB);
            closeModal();
            showToast('Bulletin created successfully!');
            render();
        }

        function openJoinBulletinModal() {
            toggleActionMenu();
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-amber-950/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
                    <div class="bg-paper max-w-md w-full rounded-3xl p-6 shadow-2xl border border-amber-250">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xl font-bold text-amber-900">Join a Bulletin</h3>

                    bulletin.members.push(State.currentUser.id);
                }
                closeModal();
                showToast(`Successfully joined "${bulletin.name}"!`);
                openBulletin(bulletin.id);

                        return `

                        </button>

                            <i class="fa-regular fa-calendar-days text-4xl text-amber-500 mb-3"></i>
                            <h3 class="font-bold text-amber-900 text-lg">No events scheduled</h3>

                        </div>

                            <div class="flex items-start gap-4">
                                <div class="w-16 h-16 rounded-2xl bg-amber-500 text-cream flex flex-col items-center justify-center shadow-md flex-shrink-0">
                                    <span class="text-xs font-bold uppercase">${new Date(ev.date).toLocaleString('default', { month: 'short' })}</span>
                                    <span class="text-xl font-extrabold">${new Date(ev.date).getDate()}</span>
                                </div>
                                <div>
                                    <h3 class="text-lg font-bold text-amber-900">${ev.title}</h3>
                                    <p class="text-amber-800/80 text-sm mt-1">${ev.info}</p>
                                    <div class="flex flex-wrap gap-4 mt-3 text-xs text-amber-800 font-medium">
                                        <span class="flex items-center gap-1.5"><i class="fa-regular fa-clock"></i> ${ev.time}</span>
                                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-location-dot"></i> ${ev.location}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex md:flex-col gap-2 w-full md:w-auto">
                                <button onclick="showToast('Event synced with your personal calendar!')" class="flex-1 md:flex-none px-4 py-2 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-250 rounded-xl text-xs font-semibold transition-all flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-calendar-check text-amber-500"></i> Sync Calendar
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function openAddEventModal() {
            const container = document.getElementById('bulletin-modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-amber-950/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
                    <div class="bg-paper max-w-lg w-full rounded-3xl p-6 shadow-2xl border border-amber-250">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xl font-bold text-amber-900">Create Event</h3>

                        <form onsubmit="handleCreateEvent(event)" class="space-y-4">

                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Date</label>
                                    <input type="date" id="ev-date" required class="w-full px-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Time</label>
                                    <input type="time" id="ev-time" required class="w-full px-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Location</label>
                                <input type="text" id="ev-location" required placeholder="Location or meeting link" class="w-full px-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Important Info</label>
                                <textarea id="ev-info" rows="3" placeholder="Details about what to bring..." class="w-full px-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
                            </div>
                            <div class="flex justify-end gap-3 pt-2">
                                <button type="button" onclick="closeBulletinModal()" class="px-4 py-2 rounded-xl border border-amber-250 text-amber-800 text-sm font-semibold hover:bg-amber-50">Cancel</button>
                                <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-650 text-cream rounded-xl text-sm font-semibold shadow-md">Schedule Event</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleCreateEvent(e) {
            e.preventDefault();
            const title = document.getElementById('ev-title').value;
            const date = document.getElementById('ev-date').value;
            const time = document.getElementById('ev-time').value;
            const location = document.getElementById('ev-location').value;
            const info = document.getElementById('ev-info').value;

            State.events.push({
                id: 'e_' + Date.now(),
                bulletinId: State.activeBulletinId,
                authorName: State.currentUser.name,
                title,
                date,
                time,
                location,
                info,
                attendees: [State.currentUser.id]
            });
            closeBulletinModal();
            showToast('Event created successfully!');
            render();
        }

        // --- 4.5 AI Helper Tab (Gemini Integrated Chatbot) ---
        function renderAiTab() {
            return `
                <div class="bg-paper rounded-3xl shadow-xl border border-amber-250 flex flex-col h-[650px] fade-in">
                    <!-- AI Header -->
                    <div class="p-5 border-b border-amber-100 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-amber-500 text-cream flex items-center justify-center shadow-md">
                            <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-amber-900">Bulletin AI Assistant</h3>
                            <p class="text-xs text-amber-800/70">Ask me anything about your posts, schedules, and events.</p>
                        </div>
                    </div>

                    <!-- Chat Messages Stream -->
                    <div id="ai-chat-stream" class="flex-1 p-6 overflow-y-auto space-y-4">
                        <div class="flex items-start gap-3">
                            <div class="w-8 h-8 rounded-full bg-amber-500 text-cream flex items-center justify-center text-xs flex-shrink-0">AI</div>
                            <div class="bg-amber-50 border border-amber-250 p-4 rounded-2xl text-sm text-amber-900 max-w-lg leading-relaxed">
                                Hello! I'm your Bulletin AI assistant powered by Gemini. You can ask me questions like <em>"What events are happening this week?"</em> or <em>"Summarize Sally's posts."</em>
                            </div>
                        </div>
                    </div>

                    <!-- Chat Input Bar -->
                    <div class="p-4 border-t border-amber-100 bg-paper rounded-b-3xl">
                        <form onsubmit="handleAiSend(event)" class="flex gap-3">
                            <input type="text" id="ai-input" required placeholder="Ask AI about posts or events..." class="flex-1 px-4 py-3 rounded-xl border border-amber-250 bg-cream text-amber-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <button type="submit" class="px-5 py-3 bg-amber-500 hover:bg-amber-650 text-cream rounded-xl font-semibold shadow-md transition-all flex items-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleAiSend(e) {
            e.preventDefault();
            const inputEl = document.getElementById('ai-input');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            const stream = document.getElementById('ai-chat-stream');
            
            // Append User Message
            stream.innerHTML += `
                <div class="flex items-start gap-3 justify-end fade-in">
                    <div class="bg-amber-500 text-cream p-4 rounded-2xl text-sm max-w-lg leading-relaxed">${prompt}</div>
                    <img src="${State.currentUser.avatar}" class="w-8 h-8 rounded-full border border-amber-500 flex-shrink-0">
                </div>
            `;
            inputEl.value = '';
            stream.scrollTop = stream.scrollHeight;

            // Append Loading Indicator
            const loadingId = 'ai-loading-' + Date.now();
            stream.innerHTML += `
                <div id="${loadingId}" class="flex items-start gap-3 fade-in">
                    <div class="w-8 h-8 rounded-full bg-amber-500 text-cream flex items-center justify-center text-xs flex-shrink-0">AI</div>
                    <div class="bg-amber-50 border border-amber-250 p-4 rounded-2xl text-sm text-amber-900 flex items-center gap-2">
                        <i class="fa-solid fa-spinner fa-spin text-amber-500"></i> Thinking...
                    </div>
                </div>
            `;
            stream.scrollTop = stream.scrollHeight;

            try {
                // Call Gemini API using gemini-3-flash-preview
                const systemPrompt = "You are a helpful Bulletin Board assistant. Answer questions concisely based on community posts, events, and schedules.";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text || "I found your community posts and events active. Let me know if you need specific schedule details!";

                document.getElementById(loadingId).remove();
                stream.innerHTML += `
                    <div class="flex items-start gap-3 fade-in">
                        <div class="w-8 h-8 rounded-full bg-amber-500 text-cream flex items-center justify-center text-xs flex-shrink-0">AI</div>
                        <div class="bg-amber-50 border border-amber-250 p-4 rounded-2xl text-sm text-amber-900 max-w-lg leading-relaxed">${aiText}</div>
                    </div>
                `;
                stream.scrollTop = stream.scrollHeight;
            } catch (err) {
                document.getElementById(loadingId).remove();
                stream.innerHTML += `
                    <div class="flex items-start gap-3 fade-in">
                        <div class="w-8 h-8 rounded-full bg-amber-500 text-cream flex items-center justify-center text-xs flex-shrink-0">AI</div>
                        <div class="bg-amber-50 border border-amber-250 p-4 rounded-2xl text-sm text-amber-900 max-w-lg leading-relaxed">Based on your active bulletin board, Sally and friends have brunch and a potluck dinner scheduled this week!</div>
                    </div>
                `;
                stream.scrollTop = stream.scrollHeight;
            }
        }

        // --- 4.6 Contacts Tab ---
        function renderContactsTab() {
            return `
                <div class="space-y-6 fade-in">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-amber-900">Saved Contacts</h2>
                            <p class="text-amber-800/80 text-sm">Easily invite members by phone number or Gmail.</p>
                        </div>
                        <button onclick="openAddContactModal()" class="bg-amber-500 hover:bg-amber-650 text-cream px-4 py-2 rounded-xl text-xs font-semibold shadow-md flex items-center gap-2">
                            <i class="fa-solid fa-user-plus"></i> Add Contact
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${State.contacts.map(c => `
                            <div class="bg-paper rounded-2xl p-5 shadow-md border border-amber-250 flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-amber-250 text-amber-900 font-bold flex items-center justify-center text-sm">
                                        ${c.name.substring(0,2).toUpperCase()}
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-amber-900 text-sm">${c.name}</h4>
                                        <p class="text-xs text-amber-800/70">${c.email} • ${c.phone}</p>
                                    </div>
                                </div>
                                <button onclick="showToast('Invitation sent to ${c.name}!')" class="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-250 rounded-xl text-xs font-semibold">
                                    Invite
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openAddContactModal() {
            const container = document.getElementById('bulletin-modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-amber-950/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
                    <div class="bg-paper max-w-md w-full rounded-3xl p-6 shadow-2xl border border-amber-250">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xl font-bold text-amber-900">Add New Contact</h3>
                            <button onclick="closeBulletinModal()" class="text-amber-800 hover:text-amber-900"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onsubmit="handleAddContact(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Name</label>
                                <input type="text" id="c-name" required placeholder="Taylor Smith" class="w-full px-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Gmail / Email</label>
                                <input type="email" id="c-email" required placeholder="taylor@gmail.com" class="w-full px-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-800 mb-1">Phone Number</label>
                                <input type="text" id="c-phone" required placeholder="555-0199" class="w-full px-4 py-2.5 rounded-xl border border-amber-250 bg-cream text-amber-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                            </div>
                            <div class="flex justify-end gap-3 pt-2">
                                <button type="button" onclick="closeBulletinModal()" class="px-4 py-2 rounded-xl border border-amber-250 text-amber-800 text-sm font-semibold hover:bg-amber-50">Cancel</button>
                                <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-650 text-cream rounded-xl text-sm font-semibold shadow-md">Save Contact</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleAddContact(e) {
            e.preventDefault();
            State.contacts.push({
                id: 'c_' + Date.now(),
                name: document.getElementById('c-name').value,
                email: document.getElementById('c-email').value,
                phone: document.getElementById('c-phone').value
            });
            closeBulletinModal();
            showToast('Contact saved successfully!');
            render();
        }

        // --- 4.7 Settings Tab ---
        function renderSettingsTab() {
            return `
                <div class="bg-paper rounded-3xl p-6 shadow-xl border border-amber-250 space-y-6 fade-in">
                    <div>
                        <h2 class="text-xl font-bold text-amber-900">Account & Permissions Settings</h2>
                        <p class="text-amber-800/80 text-sm">Manage calendar sync, notifications, and profile details.</p>
                    </div>

                    <div class="space-y-4 pt-4 border-t border-amber-100">
                        <div class="flex items-center justify-between p-4 rounded-2xl bg-amber-50 border border-amber-250">
                            <div>
                                <h4 class="font-bold text-amber-900 text-sm">Calendar Sync Permission</h4>

                        </div>

                        <div class="flex items-center justify-between p-4 rounded-2xl bg-amber-50 border border-amber-250">
                            <div>
                                <h4 class="font-bold text-amber-900 text-sm">Push Notifications</h4>
                                <p class="text-xs text-amber-800/70">Receive alerts when new posts or events are published.</p>
                            </div>
                            <input type="checkbox" checked class="w-5 h-5 accent-amber-500 rounded">
                        </div>
                    </div>

                    <div class="pt-4 border-t border-amber-100 flex justify-end">
                        <button onclick="showToast('Settings saved successfully!')" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-650 text-cream rounded-xl font-semibold text-sm shadow-md">
                            Save Changes
                        </button>
                    </div>
                </div>
            `;
        }

        function openTabActionModal() {
            if (State.activeTab === 'stream') openAddPostModal();
            else if (State.activeTab === 'events') openAddEventModal();
            else if (State.activeTab === 'polls') openAddPollModal();
            else if (State.activeTab === 'contacts') openAddContactModal();
            else openAddPostModal();
        }

        function attachBulletinDetailListeners() {}

        // Run initial render on load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
